# Keep Track — production compose file.
#
# Differences from docker-compose.yml (dev):
#   - Builds the multi-stage `production` target of each Dockerfile (compiled
#     frontend served by nginx, backend served by gunicorn) instead of the
#     dev target (Vite dev server, `uvicorn` with no process manager).
#   - No source code bind mounts — everything is baked into the image, so a
#     new deploy means rebuilding the image, not just restarting.
#   - Traefik is bundled as a reverse proxy service, so the stack is fully
#     self-contained out of the box — no separate proxy install needed.
#     Only Traefik publishes ports (80/443, configurable via
#     KEEPTRACK_HTTP_PORT/KEEPTRACK_HTTPS_PORT in .env); frontend and backend
#     publish nothing and are reached only via the "keeptrack" Docker
#     network. See docs/deployment.md.
#   - Health checks and `depends_on: condition: service_healthy` everywhere,
#     so `docker compose up -d` doesn't race backend-before-postgres or
#     frontend-before-backend.
#   - A single `watched-folder-watcher` placeholder service existed in early
#     dev compose files and was removed once the watcher became a background
#     thread inside `backend` — it was never part of this file.
#
# Usage: docker compose -f docker-compose.prod.yml up -d
# See docs/deployment.md for the full deployment guide.

services:
  # Reverse proxy — the stack's only container with published ports. Routes
  # everything to the frontend via Docker labels (see the frontend service
  # below); the frontend's own nginx already proxies /api/* to the backend,
  # so Traefik never needs to know about `backend` directly.
  #
  # ═══════════════════════════════════════════════════════════
  # TO ENABLE HTTPS WITH LET'S ENCRYPT:
  # 1. Ensure your domain points to this server
  # 2. Set your email in the acme.email line below
  # 3. Uncomment all lines marked '# SSL via Let's Encrypt'
  # 4. Uncomment all lines marked '# SSL router' (on the frontend service)
  # 5. docker compose -f docker-compose.prod.yml up -d
  # ═══════════════════════════════════════════════════════════
  traefik:
    image: traefik:v2.11
    restart: unless-stopped
    # Required for Docker Engine compatibility
    # Adjust version if needed (1.41 works with Docker Engine 20.10+)
    environment:
      - DOCKER_API_VERSION=1.41
    command:
      - '--api.insecure=false'
      - '--api.dashboard=false'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=keeptrack'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--log.level=INFO'
      - '--accesslog=true'
      - '--ping=true'
      # SSL via Let's Encrypt — uncomment to enable HTTPS
      # - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      # - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      # - '--certificatesresolvers.letsencrypt.acme.email=your@email.com'
      # - '--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json'
      # - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      # - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
    ports:
      - '${KEEPTRACK_HTTP_PORT:-80}:80'
      - '${KEEPTRACK_HTTPS_PORT:-443}:443'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - 'traefik_data:/data'
    networks:
      - keeptrack
    healthcheck:
      # Traefik v2 has no `traefik healthcheck` subcommand, so we hit the
      # `--ping` endpoint directly instead.
      test: ['CMD', 'wget', '--quiet', '--tries=1',
             '--spider', 'http://localhost:8080/ping']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: keeptrack-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No ports published — only Traefik is reachable from outside Docker.
    # Traefik routes to this container via the labels below, over the
    # "keeptrack" network.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.keeptrack.rule=PathPrefix(`/`)'
      - 'traefik.http.routers.keeptrack.entrypoints=web'
      - 'traefik.http.services.keeptrack.loadbalancer.server.port=80'
      # ═══════════════════════════════════════════════════════════
      # TO ENABLE HTTPS WITH LET'S ENCRYPT:
      # 1. Ensure your domain points to this server
      # 2. Set your email in the acme.email line on the traefik service
      # 3. Uncomment all lines marked '# SSL via Let's Encrypt' (traefik service)
      # 4. Uncomment all lines marked '# SSL router' below
      # 5. docker compose -f docker-compose.prod.yml up -d
      # ═══════════════════════════════════════════════════════════
      # SSL router — uncomment to enable HTTPS
      # - 'traefik.http.routers.keeptrack-secure.rule=PathPrefix(`/`)'
      # - 'traefik.http.routers.keeptrack-secure.entrypoints=websecure'
      # - 'traefik.http.routers.keeptrack-secure.tls=true'
      # - 'traefik.http.routers.keeptrack-secure.tls.certresolver=letsencrypt'
    networks:
      - keeptrack

  backend:
    image: keeptrack-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keeptrack_storage:/data
      - ./user-guides:/app/user-guides:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - keeptrack

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keeptrack_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keeptrack

volumes:
  # Single root for invoices, signed PDFs, reports, backups, and the watched
  # folder — storage_service.py already defaults storage_path to "/data" and
  # creates its own subdirectories under it at startup (see
  # backend/services/storage_service.py), so one volume is sufficient here
  # even though dev's docker-compose.yml splits it into four for local
  # inspection convenience.
  keeptrack_storage:
  keeptrack_db:
  # Traefik's ACME state (certificates/account key from Let's Encrypt once
  # HTTPS is enabled) — persisted so certs survive container recreation.
  traefik_data:

networks:
  keeptrack:
    driver: bridge
