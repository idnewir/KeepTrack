services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to localhost only — the backend reaches Postgres over the
    # internal Docker network (via DATABASE_URL's "postgres" hostname) and
    # never needs this published on every interface. Publishing it to
    # 0.0.0.0 exposed the database directly to anything that can reach this
    # host's network, bypassing the application entirely. Still reachable
    # from the host itself (e.g. `psql -h localhost`) for local development.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./backend:/app
      - ./user-guides:/app/user-guides:ro
      - invoice_storage:/data/invoices
      - watched_folder:/data/watched
      - output_folder:/data/output
      - report_storage:/data/reports
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  invoice_storage:
  # Default local mount point for Folder Integration's input folder — set
  # Settings -> Data -> Folder Integration's local path to /data/watched (or
  # any other path bind-mounted here) to use it. See
  # user-guides/folder-integration.md.
  watched_folder:
  # Default local mount point for Folder Integration's output folder, same
  # pattern as watched_folder above.
  output_folder:
  report_storage:
