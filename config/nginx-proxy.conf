# Example HOST-level Nginx reverse proxy for Keep Track — for when Nginx
# runs directly on the Proxmox host/VM (or an LXC), *outside* Docker,
# fronting the containerised frontend. This is a template: copy the relevant
# server block into your host Nginx's sites-available and adjust the
# server_name/port/paths for your environment.
#
# This is NOT the Nginx running inside the frontend container (that's
# frontend/nginx.conf, which already proxies /api/* to the backend) — this
# is an *additional*, optional layer for TLS termination, a shared domain
# with other sites on the same host, etc. If you're using Traefik instead
# (recommended for k3s and for a containerised Proxmox setup), see
# config/traefik-labels.yml instead and skip this file entirely.
#
# Prerequisite: because docker-compose.prod.yml publishes no ports by
# default (see its frontend service), a host-level proxy needs something to
# connect to. Uncomment the commented-out port mapping under the `frontend`
# service in docker-compose.prod.yml first:
#
#   ports:
#     - "127.0.0.1:8080:80"
#
# (loopback-only — only this host's own Nginx can reach it, not the wider
# network) — then point proxy_pass below at that port.

server {
    listen 80;
    server_name keeptrack.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment once a certificate is configured,
    # e.g. via certbot/Let's Encrypt for this server_name):
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:8080;  # matches the frontend port mapping above
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        client_max_body_size 50M;  # invoice PDF / backup zip uploads
    }
}

