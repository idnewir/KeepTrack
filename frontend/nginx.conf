# Keep Track — production nginx config (container-internal, port 80).
#
# Serves the compiled React SPA and reverse-proxies /api/* to the backend
# container, so the browser only ever talks to one origin — no CORS needed
# in production. See docs/decisions-log.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;  # invoice PDF / backup zip uploads

    # --- MIME types -----------------------------------------------------------
    # A bare `types {}` block replaces nginx's entire MIME table for this
    # context (it does not merge with it), so the base image's mime.types is
    # re-included here and only .js/.mjs is pinned on top of it. This forces
    # PDF.js's worker script (pdf.worker.min.js) to be served as
    # application/javascript instead of falling back to application/octet-stream,
    # which the signing panel's Worker() constructor rejects. Declaring this at
    # server level means every location block below (including the static
    # assets and SPA fallback blocks) inherits it automatically.
    types {
        include /etc/nginx/mime.types;
        application/javascript js mjs;
    }

    # --- Security headers ---------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    # text/html is always gzipped by nginx regardless of gzip_types (and
    # listing it explicitly here triggers a "duplicate MIME type" warning),
    # so it's deliberately left out of this list.
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Health check (for load balancers / Docker healthcheck) -------------
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # --- API proxy ------------------------------------------------------------
    # Trailing slash on proxy_pass strips the /api prefix, so /api/invoices
    # reaches the backend as /invoices.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        client_max_body_size 50M;
    }

    # --- Static assets (hashed filenames from the Vite build) ---------------
    # Cached for a year since the filename itself changes whenever the
    # content does; index.html (below) is what picks up new hashes.
    #
    # A location block that sets its own add_header stops inheriting the
    # server block's add_header list entirely (nginx doesn't merge them —
    # see http://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header),
    # so the security headers above are repeated here rather than silently
    # dropped for every static asset response.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- SPA fallback -----------------------------------------------------
    # React Router handles client-side routing, so every unmatched path
    # falls back to index.html, which must never be cached — otherwise a
    # browser could keep serving a stale build that references deleted
    # hashed asset files. Same add_header-inheritance note as above applies.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
