apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keeptrack
spec:
  # Headless — gives the StatefulSet's pod a stable DNS name
  # (postgres-0.postgres.keeptrack.svc.cluster.local); the backend still
  # just connects to plain "postgres" (see keeptrack-secrets' DATABASE_URL),
  # which resolves to this Service's ClusterIP-less A record.
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: keeptrack
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: keeptrack
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
