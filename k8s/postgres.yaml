# PostgreSQL as a StatefulSet (stable network identity/hostname, even though
# it's a single replica here) backed by keeptrack-db-pvc from pvc.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: keeptrack
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        # The official postgres image's entrypoint starts as root and drops
        # to the "postgres" user itself (via gosu) before the server process
        # runs — forcing runAsNonRoot here would stop that entrypoint from
        # even starting. fsGroup instead makes sure the mounted volume is
        # group-writable by whatever uid postgres ends up running as. See
        # docs/upgrade-notes.md's "Postgres permission denied" note, which
        # documents the same non-root behaviour for the Compose deployment.
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: keeptrack-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keeptrack-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: keeptrack-db-pvc
