# TEMPLATE — never commit this file with real values filled in.
#
# Fill in every value below (generate JWT_SECRET/MFA_ENCRYPTION_KEY with
# scripts/generate-secrets.sh), then:
#   kubectl apply -f k8s/secret.yaml
#
# Keep POSTGRES_PASSWORD and the password embedded in DATABASE_URL in sync —
# Kubernetes has no way to interpolate one Secret value into another, so
# DATABASE_URL must be written out in full here.
#
# For a real deployment, consider keeping this file out of git entirely
# (generate it with `kubectl create secret generic ... --from-literal=...`
# or a tool like sealed-secrets/SOPS instead of applying a checked-in
# manifest) — see the Secrets management item in docs/backlog.md's V2
# Wishlist.
apiVersion: v1
kind: Secret
metadata:
  name: keeptrack-secrets
  namespace: keeptrack
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  DATABASE_URL: "postgresql://keep_track:CHANGE_ME@postgres:5432/keep_track"
  JWT_SECRET: ""
  MFA_ENCRYPTION_KEY: ""
  SUPERADMIN_EMAIL: ""
  SUPERADMIN_PASSWORD: ""
  # Optional fallback AI key — leave blank to configure providers entirely
  # via Settings -> AI & Extraction instead.
  ANTHROPIC_API_KEY: ""
